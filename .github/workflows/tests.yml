name: Calculator tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Headless unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Compile all project modules
        run: python -m compileall -q hyuncalculator

  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify required toolchains
        run: command -v gcc && command -v g++ && command -v node
      - name: Native numerical smoke (11 formulas x C/C++/JavaScript)
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_ci_smoke.py
