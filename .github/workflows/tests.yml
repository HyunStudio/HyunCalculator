name: Calculator tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Headless unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Compile all project modules
        run: python -m compileall -q hyuncalculator

  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify required toolchains
        run: command -v gcc && command -v g++ && command -v node
      - name: Native numerical smoke (11 formulas x C/C++/JavaScript)
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_ci_smoke.py

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install virtual display and Tk libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
      - name: Smoke test all ten GUI tabs and accessible themes
        env:
          MPLBACKEND: Agg
        run: xvfb-run -a python tests/gui_accessibility_smoke.py

  rust-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Rust compiler (required, never silently skipped)
        run: |
          if ! command -v rustc; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rustc
          fi
          rustc --version
      - name: Compile and numerically verify six generated Rust samples
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_rust_smoke.py

  r-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Install and verify R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core
          command -v Rscript
          Rscript --version
      - name: Execute six R numeric generator checks
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_r_csharp_smoke.py --language R

  csharp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify .NET SDK
        run: dotnet --version
      - name: Compile and run six C# numeric generator checks
        env:
          MPLBACKEND: Agg
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: python tests/toolchain_r_csharp_smoke.py --language 'C#'

  julia-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Julia runtime
        run: julia --version
      - name: Execute six Julia numeric generator checks
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_julia_smoke.py

  octave-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Install GNU Octave (required, not a MATLAB license)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave
          command -v octave-cli
          octave-cli --version
      - name: Execute 17 MATLAB-compatible numeric and validation cases in Octave
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_octave_smoke.py

  compile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['C', 'C++', 'JavaScript', 'TypeScript']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        if: matrix.language == 'JavaScript' || matrix.language == 'TypeScript'
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install TypeScript compiler
        if: matrix.language == 'TypeScript'
        run: npm install --global typescript@5.9.3
      - name: Check required compiler
        run: |
          case "${{ matrix.language }}" in
            C) command -v gcc ;;
            C++) command -v g++ ;;
            JavaScript) command -v node ;;
            TypeScript) command -v tsc ;;
          esac
      - name: Build/syntax check all 33 generated formula sources
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_compile_matrix.py --language "${{ matrix.language }}"
