name: Calculator tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Headless unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Compile all project modules
        run: python -m compileall -q hyuncalculator

  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify required toolchains
        run: command -v gcc && command -v g++ && command -v node
      - name: Native numerical smoke (27 formulas x C/C++/JavaScript)
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_ci_smoke.py
      - name: Verify remaining six JavaScript formulas against Python
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_js_full_numeric.py

      - name: Verify remaining six formulas in C and C++
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_native_full_numeric.py
          python tests/toolchain_class_numeric.py C++

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install virtual display and Tk libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk
      - name: Smoke test all ten GUI tabs and accessible themes
        env:
          MPLBACKEND: Agg
        run: xvfb-run -a python tests/gui_accessibility_smoke.py

  rust-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Rust compiler (required, never silently skipped)
        run: |
          if ! command -v rustc; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rustc
          fi
          rustc --version
      - name: Compile and numerically verify six generated Rust samples
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_rust_smoke.py
          python tests/toolchain_catalog_numeric.py Rust

  r-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Install and verify R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core
          command -v Rscript
          Rscript --version
      - name: Execute six R numeric generator checks
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_r_csharp_smoke.py --language R
          python tests/toolchain_catalog_numeric.py "R"

  csharp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify .NET SDK
        run: dotnet --version
      - name: Compile and run six C# numeric generator checks
        env:
          MPLBACKEND: Agg
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          python tests/toolchain_r_csharp_smoke.py --language 'C#'
          python tests/toolchain_catalog_numeric.py "C#"
          python tests/toolchain_class_numeric.py "C#"

  julia-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Julia runtime
        run: julia --version
      - name: Execute six Julia numeric generator checks
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_julia_smoke.py
          python tests/toolchain_catalog_numeric.py Julia

  octave-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python numerical reference dependencies
        run: python -m pip install -r requirements.txt
      - name: Install GNU Octave (required, not a MATLAB license)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave
          command -v octave-cli
          octave-cli --version
      - name: Execute 17 MATLAB-compatible numeric and validation cases in Octave
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_octave_smoke.py
          python tests/toolchain_catalog_numeric.py Octave

  compile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: ['C', 'C++', 'JavaScript', 'TypeScript', 'Java', 'Go', 'Rust', 'Swift', 'Python', 'R', 'C#', 'Kotlin', 'Julia', 'MATLAB']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        if: matrix.language == 'JavaScript' || matrix.language == 'TypeScript'
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'C#'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        if: matrix.language == 'Kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: julia-actions/setup-julia@v2
        if: matrix.language == 'Julia'
        with:
          version: '1.11'
      - name: Install R runtime
        if: matrix.language == 'R'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends r-base-core
      - name: Install GNU Octave
        if: matrix.language == 'MATLAB'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install TypeScript compiler
        if: matrix.language == 'TypeScript'
        run: npm install --global typescript@5.9.3
      - name: Check required compiler
        run: |
          case "${{ matrix.language }}" in
            C) command -v gcc ;;
            C++) command -v g++ ;;
            JavaScript) command -v node ;;
            TypeScript) command -v tsc ;;
            Java) command -v javac ;;
            Go) command -v go ;;
            Rust) command -v rustc ;;
            Swift) command -v swiftc ;;
            Python) command -v python ;;
            R) command -v Rscript ;;
            C#) command -v dotnet ;;
            Kotlin) command -v kotlinc ;;
            Julia) command -v julia ;;
            MATLAB) command -v octave-cli ;;
          esac
      - name: Build/syntax check all 33 generated formula sources
        env:
          MPLBACKEND: Agg
        run: python tests/toolchain_compile_matrix.py --language "${{ matrix.language }}"

  extended-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [TypeScript, Java, Swift, Kotlin, Go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install references and TypeScript
        run: |
          python -m pip install -r requirements.txt
          npm install -g typescript
      - name: Install Kotlin compiler
        if: matrix.language == 'Kotlin'
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo /tmp/kotlin/kotlinc/bin >> "$GITHUB_PATH"
      - name: Execute all 33 formulas against numerical references
        env:
          MPLBACKEND: Agg
        run: |
          python tests/toolchain_extended_full_numeric.py '${{ matrix.language }}'
          if [ '${{ matrix.language }}' != 'Go' ]; then python tests/toolchain_class_numeric.py '${{ matrix.language }}'; fi

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Build and smoke test standalone Windows application
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HyunCalculator-Windows-x64
          path: dist/HyunCalculator-Windows-x64.zip

  desktop-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Check shared UI integration
        run: python -m unittest discover -s tests -p test_modern.py -v
      - name: Build portable desktop application
        run: python packaging/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: HyunCalculator-${{ matrix.os }}
          path: dist/
